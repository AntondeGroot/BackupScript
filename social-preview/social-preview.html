<!DOCTYPE html>
<!-- Template for social-preview.png (1280x640). Regenerate with ./render.sh; never edit the PNG by hand. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0d1117;
    --text: #f0f3f6;
    --muted: #9da7b3;
    --accent: #3fb950;
    --tag-bg: rgba(63, 185, 80, 0.12);
    --tag-border: rgba(63, 185, 80, 0.4);
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  #preview {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background:
      radial-gradient(circle at 85% 20%, rgba(63, 185, 80, 0.18), transparent 55%),
      var(--bg);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .text {
    position: absolute;
    left: 64px;
    top: 0;
    bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 32px;
    background: var(--accent);
    color: var(--bg);
    font-size: 36px;
    font-weight: 800;
    line-height: 64px;
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    margin: 0;
    font-size: 112px;
    line-height: 0.95;
    font-weight: 800;
    letter-spacing: -3px;
  }
  .tagline {
    margin: 28px 0 0;
    font-size: 30px;
    line-height: 1.3;
    color: var(--muted);
  }
  .tags { margin-top: 36px; display: flex; gap: 12px; }
  .tag {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--tag-border);
    background: var(--tag-bg);
    color: var(--accent);
    font-size: 19px;
    font-weight: 600;
  }
  .email {
    position: absolute;
    left: 676px;
    top: 56px;
    width: 576px;
    height: 640px;
    border-radius: 16px 16px 0 0;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .email iframe {
    width: 640px;
    height: 720px;
    border: 0;
    transform: scale(0.9);
    transform-origin: 0 0;
  }
</style>
</head>
<body>
<div id="preview">
  <div class="text">
    <div class="icon">&#10003;</div>
    <h1>Backup<br>Script</h1>
    <p class="tagline">Zips your notes folder on a schedule and emails you whether it worked.</p>
    <div class="tags">
      <span class="tag">Windows</span>
      <span class="tag">ZIP backups</span>
      <span class="tag">Status email</span>
    </div>
  </div>
  <div class="email"><iframe src="sample-email.html" scrolling="no"></iframe></div>
</div>
</body>
</html>
